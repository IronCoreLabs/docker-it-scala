name: CI
on:
  [ push, workflow_dispatch ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Cache
        uses: coursier/cache-action@v6
      - name: Setup SBT
        uses: coursier/setup-action@v1
        with:
          apps: sbt
          jvm: adopt:11
      - name: Build and Test
        run: sbt -v +test
